<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 CSV Calendar Viewer</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="구글 캘린더 CSV를 아름다운 월별 캘린더로 시각화">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1>📅 Calendar Viewer</h1>
    </div>
    <div class="header-center">
      <span id="currentMonthLabel" class="month-label">2026년 6월</span>
    </div>
    <div class="header-right">
      <div class="search-container" id="searchContainer">
        <button id="searchToggle" class="icon-btn" title="검색">🔍</button>
        <input type="text" id="searchInput" class="search-input" placeholder="일정 검색...">
      </div>
      <button id="filterToggle" class="icon-btn" title="필터">🏷️</button>
      <button id="themeToggleBtn" class="icon-btn" title="다크모드">🌙</button>
      <button id="uploadNewBtn" class="icon-btn" title="CSV 다시 업로드" style="display:none;">📂</button>
    </div>
  </header>

  <!-- Filter Bar -->
  <div id="filterBar" class="filter-bar hidden">
    <div id="filterContainer" class="filter-pills">
      <!-- Pills generated by JS -->
    </div>
  </div>

  <!-- Loading Area -->
  <main>
    <div id="loadingView" class="upload-area" style="display: flex;">
      <div class="upload-content">
        <div class="upload-icon" style="animation: spin 2s linear infinite;">⏳</div>
        <h2 id="loadingText">캘린더 동기화 중...</h2>
        <p>구글 캘린더에서 최신 일정을 실시간으로 불러오고 있습니다.</p>
      </div>
    </div>

    <!-- Calendar -->
    <div id="calendarView" class="calendar-container" style="display:none;">
      <div class="calendar-grid" id="calendarGrid">
        <!-- JS will generate day headers + date cells here -->
      </div>
    </div>
  </main>

  <!-- Event Detail Modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="modalClose" class="modal-close">✕</button>
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title"></h2>
        <span id="modalCategory" class="modal-category"></span>
      </div>
      <div class="modal-body">
        <div class="modal-info">
          <div class="modal-info-item">
            <span class="info-icon">📅</span>
            <span id="modalDate"></span>
          </div>
          <div class="modal-info-item" id="modalTimeContainer">
            <span class="info-icon">🕐</span>
            <span id="modalTime"></span>
          </div>
          <div class="modal-info-item" id="modalLocationContainer" style="display:none;">
            <span class="info-icon">📍</span>
            <span id="modalLocation"></span>
          </div>
        </div>
        <div id="modalDescriptionContainer" class="modal-description">
          <h3>📝 설명</h3>
          <div id="modalDescription" class="description-content"></div>
        </div>
        <div class="modal-memo">
          <h3>✏️ 메모</h3>
          <textarea id="modalMemo" class="memo-textarea" placeholder="메모를 입력하세요..."></textarea>
          <button id="saveMemoBtn" class="save-memo-btn">💾 메모 저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Day Detail Modal (for +N more) -->
  <div id="dayModalOverlay" class="modal-overlay hidden">
    <div class="modal day-modal">
      <button id="dayModalClose" class="modal-close">✕</button>
      <h2 id="dayModalTitle" class="modal-title"></h2>
      <div id="dayModalEvents" class="day-modal-events">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/api.js?v=7"></script>
  <script src="js/categories.js?v=7"></script>
  <script src="js/storage.js?v=7"></script>
  <script src="js/calendar.js?v=7"></script>
  <script src="js/modal.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
